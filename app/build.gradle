plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace 'com.alphaflix.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.alphaflix.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ── ABI filters: 64-bit (arm64, x86_64) + 32-bit fallback (armeabi-v7a) ──
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // ── Per-ABI split APKs ───────────────────────────────────────────────────
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true   // fat APK includes all ABIs
        }
    }

    // ── Version code per ABI (optional, helps Play Store) ───────────────────
    ext.abiCodes = ["armeabi-v7a": 1, "x86_64": 2, "arm64-v8a": 3]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride =
                    defaultConfig.versionCode * 10 + project.ext.abiCodes.get(abi, 0)
            }
        }
    }

    // ── Release signing (populated by CI secrets or local keystore.properties) ─
    signingConfigs {
        release {
            // CI injects these via environment variables — see .github/workflows/build.yml
            // For local signing: create keystore.properties next to this file
            def keystoreProps = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                keystoreProps.load(new FileInputStream(propsFile))
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            } else {
                // fallback to env vars set by GitHub Actions
                storeFile     System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : null
                storePassword System.getenv("KEY_STORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // use release signing if keystore is available, else falls back to debug
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Lifecycle + ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Video Player (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Shimmer loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // SharedPreferences encrypted
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
